name: PR

permissions:
  contents: read

on:
  pull_request:

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.15
    with:
      license_header_check_enabled: false
      docs_check_container_image: "swift:6.3"
      api_breakage_check_enabled: false
      format_check_container_image: "swift:6.3"
