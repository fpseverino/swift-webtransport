[package]
name = "rust-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rust-server"
path = "full.rs"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wtransport = "0.6"
http = "1"
axum = "0.7"
rcgen = "0.13"
time = "0.3"
